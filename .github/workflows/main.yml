name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: HamedRsl
          outputs: |
            dist/snake-light.svg?palette=github-light&color_snake=#7c3aed&color_dots=#ebedf0,#c7d2fe,#a5b4fc,#818cf8,#6366f1
            dist/snake-dark.svg?palette=github-dark&color_snake=#a78bfa&color_dots=#161b22,#312e81,#4338ca,#6366f1,#a5b4fc

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
